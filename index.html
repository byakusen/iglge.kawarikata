<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>変わり方調べ</title>
<style>
  :root{
    --paper:#fbfdff; --dot:#a9cdea; --ink:#22333f; --ink-soft:#5b7080;
    --blue:#1f6fbf; --blue-l:#dcedfb; --blue-ll:#eef6fd;
    --pink:#d43f79; --pink-l:#fde0eb; --pink-ll:#fdf1f6;
    --gold:#e08a1e; --line:#c8d8e4; --green:#3f9e6a;
    --f:'Hiragino Maru Gothic ProN','ヒラギノ丸ゴ ProN W4','BIZ UDPGothic','Zen Maru Gothic','Rounded Mplus 1c','Yu Gothic UI','Meiryo',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    font-family:var(--f);color:var(--ink);
    background-color:var(--paper);
    background-image:radial-gradient(var(--dot) 1.5px,transparent 1.6px);
    background-size:26px 26px;background-position:13px 13px;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit}
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px}

  .app{height:100%;display:flex;flex-direction:column}

  /* ===== ヘッダー ===== */
  header{
    flex:none;background:#fff;border-bottom:2.5px solid var(--line);
    padding:8px 16px 0;display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;
  }
  h1{font-size:20px;margin:0 0 8px;letter-spacing:.06em;white-space:nowrap}
  h1 span{color:var(--blue)}
  nav{display:flex;gap:6px}
  nav button{
    font-size:17px;font-weight:700;letter-spacing:.03em;padding:8px 18px 10px;
    border:2.5px solid var(--line);border-bottom:none;border-radius:11px 11px 0 0;
    background:#f2f7fa;color:var(--ink-soft);cursor:pointer;position:relative;top:2px;
    transition:.15s;
  }
  nav button:hover{background:#e8f2f9;color:var(--ink)}
  nav button[aria-selected="true"]{
    background:#fff;color:var(--blue);border-color:var(--blue);top:0;
    box-shadow:0 -3px 0 var(--blue) inset;
  }

  /* ===== 本体 ===== */
  main{
    flex:1;min-height:0;display:grid;
    grid-template-columns:minmax(0,1fr) 330px;gap:12px;padding:12px 14px;
  }
  .col{display:flex;flex-direction:column;gap:10px;min-height:0}
  .card{background:#fff;border:2.5px solid var(--line);border-radius:13px;padding:10px 14px}

  /* --- 問題文 --- */
  .prob{flex:none;display:flex;gap:12px;align-items:flex-start;border-color:var(--green)}
  .prob .no{
    flex:none;width:30px;height:30px;border-radius:8px;background:var(--green);color:#fff;
    font-size:17px;font-weight:700;display:grid;place-items:center;
  }
  .prob p{margin:0;font-size:16px;line-height:1.6}
  .prob b{color:var(--green)}

  /* --- 図 --- */
  .fig{flex:1 1 auto;min-height:0;max-height:38vh;display:flex;flex-direction:column;padding:8px 14px 6px}
  .fig .canvas{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
  .fig svg{width:100%;height:100%;display:block}
  .sld{flex:none;display:flex;align-items:center;gap:12px;padding-top:6px;border-top:2px dashed var(--line);margin-top:4px}
  .sld .lab{font-size:13px;color:var(--ink-soft);white-space:nowrap}
  .sld .val{font-size:20px;font-weight:700;color:var(--blue);min-width:2.6em;text-align:right}
  input[type=range]{flex:1;-webkit-appearance:none;appearance:none;background:transparent}
  input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:99px;background:var(--blue-l)}
  input[type=range]::-moz-range-track{height:10px;border-radius:99px;background:var(--blue-l)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;
    background:var(--blue);border:4px solid #fff;box-shadow:0 2px 5px rgba(0,60,120,.3);margin-top:-8px;cursor:pointer}
  input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--blue);
    border:4px solid #fff;box-shadow:0 2px 5px rgba(0,60,120,.3);cursor:pointer}

  /* --- 表 --- */
  .tbl{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:8px 14px 10px}
  .scroll{overflow-x:auto;padding:14px 4px}
  .vt{--cw:78px;--lw:250px;width:max-content;margin:0 auto;position:relative}
  .vt .row{display:grid;grid-template-columns:var(--lw) repeat(var(--n),var(--cw))}
  .vt .arow{
    display:grid;height:0;overflow:hidden;transition:height .2s;
    grid-template-columns:var(--lw) calc(var(--cw)/2) repeat(var(--n1),var(--cw)) calc(var(--cw)/2);
  }
  .vt.rule .arow{height:34px}
  .arr{position:relative;display:grid;place-items:center;height:34px}
  .arr svg{width:100%;height:34px}
  .arr span{position:absolute;font-size:16px;font-weight:700;background:#fff;padding:0 5px;border-radius:5px}
  .rl{display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;white-space:nowrap;
      font-size:clamp(19px,2.7vh,26px);font-weight:700;border:2.5px solid var(--line)}
  .rl.x{background:var(--blue-l);border-color:var(--blue);color:var(--blue)}
  .rl.y{background:var(--pink-l);border-color:var(--pink);color:var(--pink);border-top:none}
  .rl small{font-weight:400;font-size:clamp(14px,1.9vh,18px)}
  .cell{position:relative;height:clamp(58px,9.6vh,92px);display:grid;place-items:center;
        font-size:clamp(24px,3.4vh,32px);font-weight:700;
        background:#fff;border:2.5px solid var(--line);border-left:none;transition:background .15s}
  .cell.y{border-top:none;color:var(--pink)}
  .cell.x{color:var(--blue)}
  .cell.y.hid{color:transparent;background:repeating-linear-gradient(-45deg,#fff,#fff 5px,#f2f6f9 5px,#f2f6f9 10px)}
  .cell.y.hid::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;
        color:#c3d1db;font-size:28px}
  .cell.now{background:#fffaf0}
  .marker{
    position:absolute;display:none;pointer-events:none;z-index:4;
    border:4.5px solid #ef4123;border-radius:18px;transition:left .2s,top .2s,width .2s,height .2s;
  }
  .cell.pop{animation:cellpop .45s ease-out;z-index:2}
  @keyframes cellpop{
    0%{transform:scale(.55);background:#e9f8f0}
    55%{transform:scale(1.14);background:#e9f8f0}
    100%{transform:scale(1)}
  }
  .arr.top span{top:-1px;color:var(--blue)} .arr.bot span{bottom:-1px;color:var(--pink)}

  /* ===== 右パネル ===== */
  .right{position:relative}
  .qcard{flex:1;min-height:0;display:flex;flex-direction:column;border-color:var(--gold);background:#fffdf8;padding:10px 14px 12px}
  .qtop{display:flex;align-items:center;gap:8px;flex:none}
  .qno{background:var(--gold);color:#fff;font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px}
  .dots{display:flex;gap:5px;margin-left:auto}
  .dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--line);background:#fff}
  .dot.cur{border-color:var(--gold);box-shadow:0 0 0 2px #fbe4bd}
  .dot.ok{background:var(--green);border-color:var(--green)}
  .qtext{flex:1;min-height:0;display:flex;align-items:center;font-size:17px;line-height:1.65;padding:8px 0}
  .qtext>div{width:100%}
  .qtext .sub{font-size:14px;color:var(--ink-soft)}
  .qtext .sq,.qtext .ci{display:inline-grid;place-items:center;width:1.5em;height:1.5em;font-weight:700;vertical-align:-.3em}
  .qtext .sq{border:2.5px solid var(--blue);color:var(--blue);background:var(--blue-ll);border-radius:5px}
  .qtext .ci{border:2.5px solid var(--pink);color:var(--pink);background:var(--pink-ll);border-radius:50%}

  .ansrow{flex:none;display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .ansbox{
    flex:1;height:56px;border:3px solid var(--gold);border-radius:10px;background:#fff;
    display:flex;align-items:center;justify-content:flex-end;padding:0 12px;
    font-size:32px;font-weight:700;color:var(--ink);letter-spacing:.05em;
  }
  .ansbox.empty{color:#d3dee6}
  .ansbox.ok{border-color:var(--green);color:var(--green);background:#f1fbf5}
  .ansbox.ng{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
  .unit{font-size:18px;font-weight:700;color:var(--ink-soft);min-width:1.6em}

  .pad{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .key{
    height:52px;font-size:25px;font-weight:700;border-radius:11px;cursor:pointer;
    border:2.5px solid var(--line);background:#fff;color:var(--ink);transition:transform .06s,background .12s;
  }
  .key:hover{background:#f2f8fc}
  .key:active{transform:translateY(2px)}
  .key.clr{font-size:17px;color:var(--ink-soft)}
  .key.go{background:var(--green);border-color:var(--green);color:#fff;font-size:17px}
  .key.go:hover{background:#358a5b}
  .key[disabled]{opacity:.35;cursor:default}

  .navrow{flex:none;display:flex;gap:7px;margin-top:8px}
  .navrow button{
    flex:1;height:38px;font-size:14px;font-weight:700;border-radius:9px;
    border:2.5px solid var(--line);background:#fff;color:var(--ink-soft);cursor:pointer;
  }
  .navrow button:hover:not([disabled]){background:#f2f8fc;color:var(--ink)}
  .navrow button[disabled]{opacity:.35;cursor:default}

  /* 正解演出 */
  .hanamaru{
    position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.3) rotate(-25deg);
    width:190px;opacity:0;pointer-events:none;z-index:20;
  }
  .hanamaru.pop{animation:pop 1.6s ease-out}
  @keyframes pop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-25deg)}
    22%{opacity:1;transform:translate(-50%,-50%) scale(1.12) rotate(4deg)}
    35%{transform:translate(-50%,-50%) scale(1) rotate(0)}
    75%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.06) rotate(0)}
  }

  /* 全問正解 */
  .clear{flex:1;min-height:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
  .qcard.done .qtext,.qcard.done .ansrow,.qcard.done .pad{display:none}
  .qcard.done .clear{display:flex}
  .clear .big{font-size:22px;font-weight:700;color:var(--green)}
  .clear .fm{display:flex;align-items:center;gap:8px;font-size:34px;font-weight:700}
  .clear .fm .b{width:52px;height:52px;display:grid;place-items:center;border:3px solid var(--blue);
    border-radius:8px;color:var(--blue);background:var(--blue-ll)}
  .clear .fm .c{width:52px;height:52px;display:grid;place-items:center;border:3px solid var(--pink);
    border-radius:50%;color:var(--pink);background:var(--pink-ll)}
  .clear .fm .n{width:52px;height:52px;display:grid;place-items:center;border:3px solid var(--gold);
    border-radius:8px;color:var(--gold);background:#fffaf0}
  .clear .fm .s{color:var(--ink-soft);font-size:28px}
  .clear .rule{font-size:14px;line-height:1.7;color:var(--ink-soft);border-top:2px dashed var(--line);padding-top:10px}
  .clear .rule b{color:var(--gold)}

  /* 低い画面・せまい画面 */
  @media (max-height:760px){
    .key{height:44px;font-size:22px}
    .ansbox{height:48px;font-size:28px}
    .qtext{font-size:16px}
    .prob p{font-size:15px}
  }
  @media (max-width:900px){
    html,body{overflow:auto}
    main{grid-template-columns:1fr;height:auto}
    .app{height:auto;min-height:100%}
    .fig .canvas{min-height:230px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>変わり方<span>調べ</span></h1>
    <nav id="tabs" role="tablist"></nav>
  </header>

  <main>
    <div class="col">
      <div class="card prob"><div class="no">?</div><p id="probText"></p></div>
      <div class="card fig">
        <div class="canvas" id="canvas"></div>
        <div class="sld" id="sldRow">
          <span class="lab" id="sldLab"></span>
          <input type="range" id="sld">
          <span class="val" id="sldVal"></span>
        </div>
      </div>
      <div class="card tbl">
        <div class="scroll"><div class="vt" id="vt"></div></div>
      </div>
    </div>

    <div class="col right">
      <div class="card qcard" id="qcard">
        <div class="qtop">
          <span class="qno" id="qno">もんだい 1</span>
          <div class="dots" id="dots"></div>
        </div>
        <div class="qtext"><div id="qtext"></div></div>
        <div class="ansrow">
          <div class="ansbox empty" id="ansbox">?</div>
          <span class="unit" id="unit"></span>
        </div>
        <div class="pad" id="pad"></div>
        <div class="clear" id="clearBox"></div>
        <div class="navrow">
          <button id="prev">← まえ</button>
          <button id="next">つぎ →</button>
        </div>
      </div>

/* ================= 図 ================= */
function buildRect(sc){
  const N=7,S=30,P=40,W=P*2+N*S;
  const svg=E("svg",{viewBox:`0 0 ${W} ${W}`,preserveAspectRatio:"xMidYMid meet"});
  const g=E("g",{});
  for(let i=0;i<=N;i++)for(let j=0;j<=N;j++)g.appendChild(E("circle",{cx:P+i*S,cy:P+j*S,r:2.4,fill:"#a9cdea"}));
  svg.appendChild(g);
  const r=E("rect",{fill:"rgba(31,111,191,.10)",stroke:"#1f6fbf","stroke-width":4,rx:2});
  r.style.transition="all .22s ease"; svg.appendChild(r);
  const a=E("text",{"text-anchor":"middle",fill:"#1f6fbf","font-size":17,"font-weight":700});
  const b=E("text",{"text-anchor":"middle",fill:"#d43f79","font-size":17,"font-weight":700});
  const c=E("text",{"text-anchor":"middle",fill:"#5b7080","font-size":14,x:W/2,y:22});
  c.textContent="まわりの長さ 14cm";
  svg.append(a,b,c);
  sc.ref={r,a,b,N,S,P}; return svg;
}
function drawRect(sc){
  const {r,a,b,N,S,P}=sc.ref,x=sc.st.x,y=sc.f(x),bt=P+N*S;
  r.setAttribute("x",P); r.setAttribute("y",bt-y*S);
  r.setAttribute("width",x*S); r.setAttribute("height",y*S);
  a.setAttribute("x",P+x*S/2); a.setAttribute("y",bt+24); a.textContent="横 "+x+"cm";
  b.setAttribute("x",P-20); b.setAttribute("y",bt-y*S/2+6); b.textContent=y+"cm";
}

function buildTri(sc){
  const W=496,H=108;
  const svg=E("svg",{viewBox:`0 0 ${W} ${H}`,preserveAspectRatio:"xMidYMid meet"});
  const s=44,a=s/2,h=s*0.866,y0=30,gap=26,INK="#3b3b3b";
  let x=54;
  for(let k=1;k<=4;k++){
    const px=i=>x+i*a;
    const d = (k%2===1)
      ? `M${px(0)},${y0+h} L${px(k+1)},${y0+h} L${px(k)},${y0} L${px(1)},${y0} Z`
      : `M${px(0)},${y0+h} L${px(k)},${y0+h} L${px(k+1)},${y0} L${px(1)},${y0} Z`;
    svg.appendChild(E("path",{d,fill:"#fdf1cf",stroke:INK,"stroke-width":2.6,"stroke-linejoin":"round"}));
    for(let i=1;i<k;i++){
      const l = (i%2===0)
        ? {x1:px(i),y1:y0+h,x2:px(i+1),y2:y0}
        : {x1:px(i),y1:y0,x2:px(i+1),y2:y0+h};
      l.stroke=INK; l["stroke-width"]=2.2;
      svg.appendChild(E("line",l));
    }
    const lab=E("text",{x:x+(k+1)*a/2,y:y0+h+22,"text-anchor":"middle","font-size":15,"font-weight":700,fill:"#22333f"});
    lab.textContent=k+"こ"; svg.appendChild(lab);
    if(k===1){
      const my=y0+h/2;
      svg.appendChild(E("path",{d:`M${x+2},${y0+h-1} Q${x+a/2-24},${my} ${x+a-2},${y0+1}`,
        fill:"none",stroke:"#7b8a95","stroke-width":1.6,"stroke-dasharray":"4 4"}));
      const t=E("text",{x:x-14,y:my+5,"text-anchor":"end","font-size":14,fill:"#22333f"});
      t.textContent="1cm"; svg.appendChild(t);
    }
    x += (k+1)*a + gap;
  }
  const dd=E("text",{x:x+4,y:y0+h/2+9,"font-size":22,fill:"#6b7b88"});
  dd.textContent="…"; svg.appendChild(dd);
  sc.ref={}; return svg;
}
function drawTri(){}

function buildSq(sc){
  const N=8,S=25,P=30,GW=P*2+N*S, TY=GW+16, TH=34, HT=TY+TH+34;
  const svg=E("svg",{viewBox:`0 0 ${GW} ${HT}`,preserveAspectRatio:"xMidYMid meet"});
  const g=E("g",{});
  for(let i=0;i<=N;i++)for(let j=0;j<=N;j++)g.appendChild(E("circle",{cx:P+i*S,cy:P+j*S,r:2.2,fill:"#a9cdea"}));
  svg.appendChild(g);
  const q=E("rect",{x:P,fill:"rgba(31,111,191,.10)",stroke:"#d43f79","stroke-width":5,rx:2});
  q.style.transition="all .22s ease"; svg.appendChild(q);
  const lab=E("text",{"text-anchor":"middle","font-size":16,"font-weight":700,fill:"#1f6fbf"});
  svg.appendChild(lab);
  const tw=(GW-16)/4;
  for(let k=0;k<4;k++){
    svg.appendChild(E("rect",{x:8+k*tw,y:TY,width:tw-5,height:TH,rx:6,fill:"#dcedfb",stroke:"#1f6fbf","stroke-width":2.5}));
    const t=E("text",{x:8+k*tw+(tw-5)/2,y:TY+TH/2+7,"text-anchor":"middle","font-size":18,"font-weight":700,fill:"#1f6fbf"});
    t.textContent="□"; svg.appendChild(t);
  }
  const tot=E("text",{x:GW/2,y:TY+TH+24,"text-anchor":"middle","font-size":15,"font-weight":700,fill:"#d43f79"});
  svg.appendChild(tot);
  sc.ref={q,lab,tot,N,S,P}; return svg;
}
function drawSq(sc){
  const {q,lab,tot,N,S,P}=sc.ref,x=sc.st.x,bt=P+N*S;
  q.setAttribute("y",bt-x*S); q.setAttribute("width",x*S); q.setAttribute("height",x*S);
  lab.setAttribute("x",P+x*S/2); lab.setAttribute("y",bt+22); lab.textContent="1辺 "+x+"cm";
  tot.textContent="まわりの長さ ○ ＝ "+sc.f(x)+"cm";
}

/* ================= 表 ================= */
function buildTable(sc){
  const t=document.getElementById("vt");
  t.innerHTML="";
  const n=sc.xs.length;
  t.style.setProperty("--n",n);
  t.style.setProperty("--n1",n-1);
  const sp=()=>document.createElement("div");
  const arrow=(pos,label)=>{
    const d=document.createElement("div"); d.className="arr "+pos;
    const c=pos==="top"?"#1f6fbf":"#d43f79";
    const p=pos==="top"?"M8 24 Q45 2 82 22":"M8 4 Q45 26 82 6";
    const hd=pos==="top"?"M82 22 L74 21 M82 22 L80 14":"M82 6 L74 8 M82 6 L80 14";
    d.innerHTML='<svg viewBox="0 0 90 28" preserveAspectRatio="none"><path d="'+p+'" fill="none" stroke="'+c+'" stroke-width="2.4" stroke-linecap="round"/><path d="'+hd+'" fill="none" stroke="'+c+'" stroke-width="2.4" stroke-linecap="round"/></svg><span>'+label+'</span>';
    return d;
  };
  const rl=(name,u,cls)=>{const d=document.createElement("div");d.className="rl "+cls;d.innerHTML=name+' <small>'+u+'</small>';return d;};

  const arowOf=(pos,label)=>{
    const r=document.createElement("div"); r.className="arow "+pos;
    r.appendChild(sp()); r.appendChild(sp());          // 見出し列 ＋ 半マス
    for(let i=0;i<n-1;i++) r.appendChild(arrow(pos,label));
    r.appendChild(sp());                               // 右はし 半マス
    return r;
  };

  t.appendChild(arowOf("top",sc.dx));

  const rowX=document.createElement("div"); rowX.className="row";
  rowX.appendChild(rl(sc.xLabel,sc.xUnit,"x"));
  sc.xCells=sc.xs.map(v=>{
    const c=document.createElement("div");c.className="cell x";c.textContent=v;rowX.appendChild(c);return c;});
  t.appendChild(rowX);

  const rowY=document.createElement("div"); rowY.className="row";
  rowY.appendChild(rl(sc.yLabel,sc.yUnit,"y"));
  sc.yCells=sc.xs.map((v,i)=>{
    const c=document.createElement("div");c.className="cell y";c.textContent=sc.f(v);
    c.onclick=()=>{sc.st.seen.has(i)?sc.st.seen.delete(i):sc.st.seen.add(i);paintTable(sc);};
    rowY.appendChild(c);return c;});
  t.appendChild(rowY);

  t.appendChild(arowOf("bot",sc.dy));
  const mk=document.createElement("div"); mk.className="marker";
  t.appendChild(mk); sc.marker=mk;
  sc.tableEl=t;
}

/* 今こたえるマス（上下2つ）を赤いわくで囲む */
function paintMarker(sc){
  const m=sc.marker; if(!m) return;
  const i=sc.xs.indexOf(sc.st.x);
  const cx=sc.xCells[i], cy=sc.yCells[i];
  if(i<0||!cx||typeof cx.offsetLeft!=="number"){ m.style.display="none"; return; }
  const pad=8;
  m.style.display="block";
  m.style.left=(cx.offsetLeft-pad)+"px";
  m.style.top=(cx.offsetTop-pad)+"px";
  m.style.width=(cx.offsetWidth+pad*2)+"px";
  m.style.height=(cx.offsetHeight+cy.offsetHeight+pad*2)+"px";
}
function paintTable(sc){
  const cur=sc.xs.indexOf(sc.st.x);
  sc.xCells.forEach((c,i)=>c.classList.toggle("now",i===cur));
  sc.yCells.forEach((c,i)=>{c.classList.toggle("now",i===cur);c.classList.toggle("hid",!sc.st.seen.has(i));});
  sc.tableEl.classList.toggle("rule", sc.st.seen.size===sc.xs.length);
  paintMarker(sc);
  setTimeout(()=>paintMarker(sc),240);   // 矢印の行が開いたあとに位置を合わせ直す
}

/* ================= 画面 ================= */
const $=id=>document.getElementById(id);
const snd=$("snd"), hana=$("hana");
let act=0;
const S=()=>SCENES[act];

SCENES.forEach((s,i)=>{
  const b=document.createElement("button");
  b.type="button"; b.textContent=s.tab; b.setAttribute("role","tab");
  b.onclick=()=>{act=i;mount();};
  $("tabs").appendChild(b); s.tabBtn=b;
});

/* テンキー */
const PAD=["1","2","3","4","5","6","7","8","9","けす","0","こたえ"];
PAD.forEach(k=>{
  const b=document.createElement("button");
  b.className="key"+(k==="けす"?" clr":k==="こたえ"?" go":"");
  b.textContent=k; b.type="button";
  b.onclick=()=>press(k);
  $("pad").appendChild(b);
});

function press(k){
  const sc=S(), st=sc.st, q=sc.qs[st.q];
  if(st.ok.has(st.q)) return;
  if(k==="けす"){ st.input=""; paintAns(); return; }
  if(k==="こたえ"){ check(); return; }
  if(st.input.length>=3) return;
  st.input+=k;
  if(q.fill) fillStep(false); else paintAns();
}

/* 表うめ：正しい数を入れた時点で つぎのマスへ */
function fillStep(force){
  const sc=S(), st=sc.st, q=sc.qs[st.q];
  const want=sc.f(q.fill[st.sub]), w=String(want);
  if(st.input!=="" && Number(st.input)===want){
    const idx=sc.xs.indexOf(q.fill[st.sub]);
    st.seen.add(idx); st.sub++; st.input="";
    paintTable(sc); flashCell(sc,idx);
    if(st.sub>=q.fill.length){          // さいごのマスまで うまった
      st.ok.add(st.q); st.flash=true; paintAns(); paintDots(); celebrate();
      setTimeout(()=>{ st.input=""; advance(); },1700);
    }else{
      paintQ();
    }
    return;
  }
  if(force || st.input.length>=w.length){
    const box=$("ansbox");
    box.classList.remove("ng"); void box.offsetWidth; box.classList.add("ng");
    setTimeout(()=>{ st.input=""; paintAns(); },450);
    return;
  }
  paintAns();
}

function flashCell(sc,i){
  const c=sc.yCells[i]; if(!c) return;
  c.classList.remove("pop"); void c.offsetWidth; c.classList.add("pop");
}

function paintAns(){
  const st=S().st, box=$("ansbox");
  box.classList.remove("ng");
  box.textContent = st.input==="" ? "?" : st.input;
  box.classList.toggle("empty", st.input==="");
  box.classList.toggle("ok", st.ok.has(st.q)||st.flash);
}

function check(){
  const sc=S(), st=sc.st, q=sc.qs[st.q];
  if(st.input==="") return;
  if(q.fill){ fillStep(true); return; }
  if(Number(st.input)!==q.a){
    const box=$("ansbox");
    box.classList.remove("ng"); void box.offsetWidth; box.classList.add("ng");
    setTimeout(()=>{ st.input=""; paintAns(); },500);
    return;
  }
  st.flash=true;
  st.ok.add(st.q);
  if(q.set!==undefined){
    const i=sc.xs.indexOf(q.set);
    if(i>=0){ st.seen.add(i); st.x=q.set; syncFig(); }
  }
  paintAns(); paintDots(); paintTable(sc); celebrate();
  setTimeout(advance,1500);
}

function advance(){
  const sc=S(), st=sc.st;
  if(st.ok.size===sc.qs.length){ showClear(); return; }
  let n=st.q;
  for(let i=1;i<=sc.qs.length;i++){ const j=(st.q+i)%sc.qs.length; if(!st.ok.has(j)){n=j;break;} }
  st.q=n; st.input=""; paintQ();
}

function celebrate(){
  try{ snd.currentTime=0; snd.play(); }catch(e){}
  hana.classList.remove("pop"); void hana.offsetWidth; hana.classList.add("pop");
}

function paintDots(){
  const sc=S(), d=$("dots"); d.innerHTML="";
  sc.qs.forEach((_,i)=>{
    const s=document.createElement("span");
    s.className="dot"+(sc.st.ok.has(i)?" ok":"")+(i===sc.st.q?" cur":"");
    d.appendChild(s);
  });
}

function paintQ(){
  const sc=S(), st=sc.st, q=sc.qs[st.q];
  st.flash=false;
  $("qcard").classList.remove("done");
  if(q.fill){
    const i=Math.min(st.sub,q.fill.length-1), x=q.fill[i];
    $("qno").textContent="もんだい 1　（"+(i+1)+"／"+q.fill.length+"）";
    $("qtext").innerHTML=q.tmpl.replace("{x}",x);
    st.x=x; syncFig();
  }else{
    $("qno").textContent="もんだい "+(st.q+1);
    $("qtext").innerHTML=q.t;
  }
  $("unit").textContent=q.u;
  $("prev").disabled = st.q===0;
  $("next").disabled = st.q===sc.qs.length-1;
  paintAns(); paintDots();
}

function showClear(){
  const sc=S(), box=$("clearBox");
  let f='<div class="fm">';
  sc.formula.forEach(p=>{
    if(p.k==="s") f+='<span class="s">'+p.v+'</span>';
    else f+='<span class="'+(p.k==="b"?"b":p.k==="c"?"c":"n")+'">'+p.v+'</span>';
  });
  f+='</div>';
  box.innerHTML='<div class="big">ぜんぶ せいかい！</div>'+f+'<div class="rule">'+sc.rule+'</div>';
  $("qcard").classList.add("done");
  $("qno").textContent="まとめ";
}

$("prev").onclick=()=>{const st=S().st; if(st.q>0){st.q--;st.input="";paintQ();}};
$("next").onclick=()=>{const sc=S(),st=sc.st; if(st.q<sc.qs.length-1){st.q++;st.input="";paintQ();}};

function syncFig(){
  const sc=S();
  $("sld").value=sc.st.x;
  $("sldVal").textContent=sc.st.x+sc.xUnit.replace(/[()]/g,"");
  sc.draw(sc);
  paintTable(sc);
}

function mount(){
  const sc=S();
  SCENES.forEach((s,i)=>s.tabBtn.setAttribute("aria-selected",i===act));
  $("probText").innerHTML=sc.prob;
  $("canvas").innerHTML=""; $("canvas").appendChild(sc.build(sc));
  $("sldRow").style.display = sc.noSlider ? "none" : "";
  const sld=$("sld");
  sld.min=sc.xs[0]; sld.max=sc.xs[sc.xs.length-1]; sld.step=1; sld.value=sc.st.x;
  sld.setAttribute("aria-label",sc.xLabel);
  sld.oninput=()=>{ sc.st.x=Number(sld.value); sc.st.seen.add(sc.xs.indexOf(sc.st.x)); syncFig(); };
  $("sldLab").textContent=sc.xLabel+" を動かす";
  buildTable(sc);
  syncFig();
  if(sc.st.ok.size===sc.qs.length) showClear(); else paintQ();
}

document.addEventListener("keydown",e=>{
  if(/^[0-9]$/.test(e.key)) press(e.key);
  else if(e.key==="Enter") press("こたえ");
  else if(e.key==="Backspace"||e.key==="Delete") press("けす");
});

mount();
</script>
</body>
</html>
